<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Módulo 9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudio del Módulo 9 (Universo natural) de Prepa Abierta para Alan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>/* Concepto: "Bitácora de taller" — app de bolsillo; cada tema es una hoja de bitácora con margen y resaltador;
   las opciones de respuesta son los óvalos de la hoja de respuestas. Negro (su color) con naranja de balón de basket. */
:root {
  --bg: #f4f2ef;
  --surface: #ffffff;
  --surface-2: #efebe6;
  --ink: #1a1817;
  --muted: #615a54;
  --line: #e2dcd5;
  --accent: #c2410c;
  --accent-2: #e2581a;
  --accent-soft: #fde9dd;
  --on-accent: #ffffff;
  --hero: #171615;
  --on-hero: #ffffff;
  --hero-accent: #ff8a3d;
  --mark: #ffd98a;
  --mark-ink: #1a1817;
  --ok: #17845a;
  --ok-soft: #dff5ea;
  --bad: #c2403a;
  --bad-soft: #fde6e4;
  --warn: #9a5d06;
  --warn-soft: #fff0d6;
  --margin-rule: #f2c3a6;
  --shadow: 0 1px 2px rgba(30, 20, 10, .06), 0 6px 18px rgba(30, 20, 10, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --surface: #1d1b1a; --surface-2: #282523; --ink: #f1ede9; --muted: #aaa29a; --line: #36322e;
    --accent: #ff8a4c; --accent-2: #ffa772; --accent-soft: #3a2418; --on-accent: #1d0d03;
    --hero: #000000; --on-hero: #ffffff; --hero-accent: #ff8a4c;
    --mark: #6b4a17; --mark-ink: #fff3dc; --ok: #5fd39f; --ok-soft: #173627; --bad: #ff8a80; --bad-soft: #3d1f1d;
    --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3a2a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1d1b1a; --surface-2: #282523; --ink: #f1ede9; --muted: #aaa29a; --line: #36322e;
  --accent: #ff8a4c; --accent-2: #ffa772; --accent-soft: #3a2418; --on-accent: #1d0d03;
  --hero: #000000; --on-hero: #ffffff; --hero-accent: #ff8a4c;
  --mark: #6b4a17; --mark-ink: #fff3dc; --ok: #5fd39f; --ok-soft: #173627; --bad: #ff8a80; --bad-soft: #3d1f1d;
  --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3a2a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
mark { background: linear-gradient(transparent 38%, var(--mark) 38%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); padding: 0 2px; }
.app {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.tnum { font-variant-numeric: tabular-nums; }

/* Botones */
.btn {
  border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: .98rem;
  background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  text-decoration: none; justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 13px; min-height: 36px; font-size: .88rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 700; min-height: 36px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Chips de prioridad */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.alta { background: var(--bad-soft); color: var(--bad); }
.chip.media { background: var(--warn-soft); color: var(--warn); }
.chip.baja { background: var(--surface-2); color: var(--muted); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.fmt { background: var(--accent-soft); color: var(--accent); }

/* Barra de progreso */
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* Inicio */
.hero { background: var(--hero); color: var(--on-hero); border-top: 5px solid var(--hero-accent); border-radius: 20px; padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero h1 { color: var(--on-hero); }
.hero .sub { opacity: .88; }
.count { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.count b { font-family: var(--font-display); font-size: 3.4rem; line-height: .9; font-weight: 800; }
.hero .bar { background: rgba(255,255,255,.25); }
.hero .bar > i { background: var(--hero-accent); }
.hero .count b { color: var(--hero-accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; }
.stat span { font-size: .8rem; color: var(--muted); }
.mission { border-left: 5px solid var(--accent); }
.mission-l { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.mission-l .t { flex: 1; min-width: 0; font-weight: 700; }
.mission-l.done { opacity: .6; }
.motiv { font-family: var(--font-display); font-size: 1.05rem; font-weight: 650; }
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.compare b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; display: block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface-2); font-size: .75rem; font-weight: 700; display: grid; gap: 4px; }
.badge .bi { font-size: 1.6rem; filter: grayscale(1); opacity: .35; }
.badge.got { background: var(--accent-soft); color: var(--accent); }
.badge.got .bi { filter: none; opacity: 1; }

/* Ruta */
.world { display: grid; gap: 8px; }
.world-h { display: flex; gap: 10px; align-items: center; }
.world-h .wi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.lrow .n { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.lrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.lrow.started .n { border-color: var(--accent); color: var(--accent); }
.lrow .tt { font-weight: 700; line-height: 1.25; }
.lrow .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: .8rem; color: var(--muted); }
.mini-bar { width: 54px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }

/* Lección: hoja de cuaderno */
.lesson-top { display: grid; gap: 10px; }
.steps-dots { display: flex; gap: 4px; }
.steps-dots i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.cur { background: var(--accent-2); }
.sheet { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 16px 18px 26px; position: relative; display: grid; gap: 12px; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 12px; top: 14px; bottom: 14px; width: 2px; background: var(--margin-rule); border-radius: 2px; }
.sheet h2 { color: var(--accent); }
.sheet .body { font-size: 1.06rem; line-height: 1.65; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.en-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .95rem; display: grid; gap: 6px; }
.en-box .lab { font-size: .72rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.nav-btns { display: flex; gap: 10px; justify-content: space-between; }
.nav-btns .btn { flex: 1; }
.callout { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.callout.trap { background: var(--bad-soft); }
.callout.trap h3 { color: var(--bad); }
.callout.trick { background: var(--accent-soft); }
.callout.trick h3 { color: var(--accent); }
.callout ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.solved ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.solved li.hide { display: none; }
.answer-box { background: var(--ok-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 700; }

/* Visuales */
.vis { margin-top: 4px; min-width: 0; }
.pyr { display: grid; gap: 4px; justify-items: center; }
.pyr-row { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 7px 10px; text-align: center; display: grid; font-size: .9rem; line-height: 1.25; }
.pyr-row:nth-child(2) { background: var(--accent-2); }
.pyr-row:nth-child(3) { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.pyr-row:nth-child(4) { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); color: var(--ink); }
.pyr-row:nth-child(5) { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); color: var(--ink); }
.pyr-row span { font-size: .78rem; opacity: .9; }
.pyr-note { font-size: .78rem; color: var(--muted); }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: flex; gap: 0; min-width: max-content; position: relative; padding-top: 6px; }
.line-item { width: 132px; display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; padding: 0 6px; }
.line-item::before { content: ""; position: absolute; top: 37px; left: 0; right: 0; height: 3px; background: var(--line); z-index: 0; }
.line-age { font-size: .74rem; font-weight: 800; color: var(--accent); min-height: 2.2em; display: grid; align-items: end; }
.line-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .85rem; z-index: 1; }
.line-t { font-weight: 700; font-size: .86rem; line-height: 1.2; }
.line-s { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.flow { display: grid; gap: 4px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.flow-step b { display: block; line-height: 1.25; }
.flow-step small { display: block; line-height: 1.35; margin-top: 2px; }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.flow-arrow { text-align: center; color: var(--muted); line-height: 1; font-size: .9rem; }
.flow-back { font-size: .85rem; font-weight: 700; color: var(--accent); text-align: center; padding-top: 4px; }
.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl.wide { min-width: 460px; }
.tbl th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 8px 10px; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
.tbl td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.tree { display: grid; gap: 10px; justify-items: center; }
.tree-root { background: var(--accent); color: var(--on-accent); padding: 8px 18px; border-radius: 10px; font-weight: 800; font-family: var(--font-display); }
.tree-kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; width: 100%; }
.tree-kid { border: 2px solid var(--accent); border-radius: 10px; padding: 8px; text-align: center; display: grid; }
.tree-kid small { display: block; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.vs-col { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.vs-h { font-weight: 800; font-size: .82rem; letter-spacing: .03em; color: var(--accent); margin-bottom: 6px; }
.vs-col ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: .9rem; line-height: 1.35; }
.vs-mid { align-self: center; font-weight: 800; color: var(--muted); font-size: .8rem; }
@media (max-width: 460px) { .vs { grid-template-columns: 1fr; } .vs-mid { justify-self: center; } }
.pairs { display: grid; gap: 6px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: .92rem; line-height: 1.4; }
@media (max-width: 460px) { .pair { grid-template-columns: 1fr; gap: 2px; } }
.doc { border: 1.5px dashed var(--line); border-radius: 10px; overflow: hidden; }
.doc-h { background: var(--surface-2); padding: 6px 10px; font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.doc-b { padding: 10px 12px; font-size: .95rem; }

/* Preguntas: óvalos de la hoja de respuestas */
.q { display: grid; gap: 12px; }
.q-text { font-size: 1.08rem; font-weight: 600; line-height: 1.5; }
.passage { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: .98rem; line-height: 1.6; }
.passage h3 { font-size: .98rem; margin-bottom: 6px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 52px; width: 100%; line-height: 1.35; }
.opt .ov { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ov { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ov { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ov { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb b.h { font-family: var(--font-display); font-size: 1.05rem; }
.fb.ok b.h { color: var(--ok); }
.fb.no b.h { color: var(--bad); }
.hint { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.hint ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.conf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.conf button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 700; }
.conf button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.qnav button { height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 700; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--ink); }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Resultados */
.grade { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 8px 0; }

.grade > b { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-weight: 800; color: var(--accent); }
.unitbars { display: grid; gap: 10px; }
.unitbar { display: grid; gap: 4px; }
.review-item { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; font-size: .95rem; }
.review-item .yo { color: var(--bad); }
.review-item .ok { color: var(--ok); font-weight: 700; }
.histo { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding-top: 6px; }
.histo .col { flex: 1; display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; min-width: 0; }
.histo .col i { width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; display: block; }
.histo .col.base i { background: var(--muted); }
.histo .col span { font-size: .7rem; color: var(--muted); }
.histo .col b { font-size: .78rem; }

/* Repaso */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 6px; min-height: 104px; align-content: start; }
.tile .ti { font-size: 1.5rem; }
.tile b { font-family: var(--font-display); font-size: 1.02rem; }
.tile span { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.flip { perspective: 1000px; }
.flip-in { position: relative; min-height: 220px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 22px; display: grid; place-items: center; text-align: center; font-size: 1.2rem; font-weight: 700; line-height: 1.4; box-shadow: var(--shadow); }
.face.front { background: var(--surface); }
.face.back { background: var(--accent); color: var(--on-accent); transform: rotateY(180deg); font-size: 1.05rem; }
.face small { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
.tf-card { text-align: center; font-size: 1.18rem; font-weight: 700; padding: 28px 18px; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order-list { display: grid; gap: 8px; }
.order-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.order-item .on { font-weight: 800; color: var(--accent); text-align: center; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 800; }
.order-item.good { border-color: var(--ok); background: var(--ok-soft); }
.order-item.badp { border-color: var(--bad); background: var(--bad-soft); }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; min-height: 52px; font-size: .9rem; font-weight: 600; line-height: 1.3; }
.match-grid button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match-grid button.done { border-color: var(--ok); background: var(--ok-soft); opacity: .7; }
.match-grid button.err { border-color: var(--bad); background: var(--bad-soft); }
.gloss-row { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.gloss-row .es { font-weight: 800; }
.gloss-row .en { color: var(--accent); font-weight: 700; font-size: .92rem; }
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; background: var(--surface); min-height: 46px; }
select.search { appearance: auto; }

/* Examen */
.ticket { border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--surface); }
.ticket-h { background: var(--ink); color: var(--bg); padding: 10px 14px; font-weight: 800; letter-spacing: .06em; font-size: .8rem; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ticket-b { padding: 14px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: .95rem; }
.kv dt { color: var(--muted); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.kv dd { margin: 0; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 2px; }
.breath { display: grid; place-items: center; gap: 14px; padding: 16px 0; }
.breath-c { width: 150px; height: 150px; border-radius: 50%; background: var(--accent-soft); border: 3px solid var(--accent); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); color: var(--accent); transition: transform 4s ease-in-out; text-align: center; padding: 10px; }
.breath-c.in { transform: scale(1.3); }
.map-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.dots { display: flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }

/* Navegación inferior */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: .72rem; font-weight: 700; color: var(--muted); min-height: 58px; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.back { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 6px 0; display: inline-flex; gap: 6px; align-items: center; }
.sheet-modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 5, 20, .5); display: grid; align-items: end; }
.sheet-modal .panel { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 82vh; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-width: 720px; width: 100%; margin: 0 auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: .92rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.confetti { animation: pop .6s ease; }
@keyframes pop { 0% { transform: translateY(6px); opacity:.6 } 60% { transform: translateY(-1px); opacity:1 } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.app > * { min-width: 0; max-width: 100%; }
.btn { max-width: 100%; text-align: center; overflow-wrap: anywhere; }
.review-item, details { min-width: 0; overflow-wrap: anywhere; }
.review-item { grid-template-columns: minmax(0, 1fr); } .stack { grid-template-columns: minmax(0, 1fr); }
.btn.small { display: inline-block; white-space: normal; line-height: 1.3; }
details:not([open]) > :not(summary) { display: none; } details { overflow: hidden; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; text-align: left; justify-self: start; max-width: 100%; }
/* Añadidos para el Módulo 9 */
.eq { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.eq-f { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; text-align: center; color: var(--accent); letter-spacing: .01em; overflow-wrap: anywhere; }
.eq-v { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: .9rem; }
.eq-v b { color: var(--ink); font-family: var(--font-display); }
.layers { display: grid; gap: 0; border-radius: 12px; overflow: hidden; }
.layer { padding: 9px 12px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: .9rem; }
.layer b { display: block; }
.layer small { opacity: .85; }
.layer .d { font-weight: 800; font-size: .8rem; white-space: nowrap; }
.formula-row { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
.formula-row .f { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.1rem; overflow-wrap: anywhere; }

<body>
<div id="app"><p style="padding:24px">Cargando tu plataforma…</p></div>
<noscript><p style="padding:24px">Activa JavaScript para usar la plataforma.</p></noscript>
<script>const V = {
  // Pirámide: niveles de ABAJO hacia ARRIBA
  pyr(levels) {
    const n = levels.length;
    const rows = levels.slice().reverse().map((l, i) => {
      const w = 38 + (i * (62 / Math.max(1, n - 1)));
      return `<div class="pyr-row" style="width:${w}%"><b>${l.t}</b>${l.s ? `<span>${l.s}</span>` : ''}</div>`;
    }).join('');
    return `<div class="vis pyr">${rows}<div class="pyr-note">⬆ Se sube de abajo hacia arriba</div></div>`;
  },
  // Línea del tiempo horizontal
  line(items) {
    return `<div class="vis line-wrap"><div class="line">${items.map((it, i) =>
      `<div class="line-item"><div class="line-age">${it.a}</div><div class="line-dot">${i + 1}</div><div class="line-t">${it.t}</div>${it.s ? `<div class="line-s">${it.s}</div>` : ''}</div>`).join('')}</div></div>`;
  },
  // Secuencia de pasos (cycle = proceso que se repite)
  flow(items, cycle) {
    return `<div class="vis flow${cycle ? ' cycle' : ''}">${items.map((it, i) =>
      `<div class="flow-step"><span class="flow-n">${i + 1}</span><div><b>${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</div></div>`).join('<div class="flow-arrow" aria-hidden="true">↓</div>')}${cycle ? '<div class="flow-back">↺ Puedes regresar a cualquier paso: el proceso se repite</div>' : ''}</div>`;
  },
  // Tabla
  tbl(head, rows) {
    return `<div class="vis tbl-wrap"><table class="tbl${head.length > 2 ? ' wide' : ''}"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  // Árbol / mapa conceptual simple
  tree(root, kids) {
    return `<div class="vis tree"><div class="tree-root">${root}</div><div class="tree-kids">${kids.map(k =>
      `<div class="tree-kid"><b>${k.t}</b>${k.s ? `<small>${k.s}</small>` : ''}</div>`).join('')}</div></div>`;
  },
  // Dos columnas que se comparan
  vs(a, b) {
    const col = c => `<div class="vs-col"><div class="vs-h">${c.t}</div><ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    return `<div class="vis vs">${col(a)}<div class="vs-mid">vs</div>${col(b)}</div>`;
  },
  // Tarjetas término → significado
  pairs(list) {
    return `<div class="vis pairs">${list.map(p => `<div class="pair"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
  },
  // Caja de ejemplo (texto modelo)
  doc(title, html) {
    return `<div class="vis doc"><div class="doc-h">${title}</div><div class="doc-b">${html}</div></div>`;
  }
  ,
  // Fórmula grande con su leyenda de variables: rows = [[símbolo, significado], ...]
  eq(f, rows, note) {
    return `<div class="vis eq"><div class="eq-f">${f}</div>${rows && rows.length ? `<div class="eq-v">${rows.map(r => `<b>${r[0]}</b><span>${r[1]}</span>`).join('')}</div>` : ''}${note ? `<small class="muted">${note}</small>` : ''}</div>`;
  },
  // Capas (de arriba hacia abajo): [{t, s, d}] con color creciente
  layers(items) {
    const n = items.length;
    return `<div class="vis layers">${items.map((it, i) => { const p = 12 + Math.round(i * (46 / Math.max(1, n - 1))); return `<div class="layer" style="background:color-mix(in srgb, var(--accent) ${p}%, var(--surface));color:var(--ink)"><span><b>${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</span>${it.d ? `<span class="d">${it.d}</span>` : ''}</div>`; }).join('')}</div>`;
  }
};

/* MUNDOS · 3 unidades del Módulo 9 */
const WORLDS = [
  { id: 1, unit: 1, name: 'El átomo por dentro', icon: '⚛️' },
  { id: 2, unit: 1, name: 'La materia y sus cambios', icon: '🧪' },
  { id: 3, unit: 1, name: 'Enlaces, tabla y nombres', icon: '🔗' },
  { id: 4, unit: 1, name: 'Disoluciones y energía', icon: '⚡' },
  { id: 5, unit: 2, name: 'El cielo en movimiento', icon: '🪐' },
  { id: 6, unit: 2, name: 'La Tierra por dentro', icon: '🌋' },
  { id: 7, unit: 3, name: 'Las moléculas de la vida', icon: '🧬' },
  { id: 8, unit: 3, name: 'Células, energía y vida', icon: '🌱' }
];
const LESSONS = [];

/* ───────── L · MODELOS ATÓMICOS ───────── */
LESSONS.push({
  id: 'modelos', world: 1, unit: 1, title: 'Los modelos atómicos', prio: 'alta', mins: 20,
  freq: 'Salió 5 veces en los 3 exámenes de práctica. En tu simulacro fallaste la de Bohr (pregunta 3).',
  goal: 'Saber qué aportó cada científico al modelo del átomo y en qué orden.',
  en: 'En el taller: un modelo es como el diagrama de un circuito. No es el aparato real, pero explica cómo funciona. Cada científico «actualizó el diagrama» del átomo.',
  steps: [
    { h: 'Imagina que…', t: 'Imagina que te dan una caja cerrada y no la puedes abrir. Solo puedes agitarla, pesarla o lanzarle cosas para adivinar qué hay dentro. Eso hicieron los científicos con el átomo: nadie lo veía, así que propusieron <mark>modelos atómicos</mark>, es decir, explicaciones de cómo está formada la materia.',
      en: 'Igual que cuando revisas un aparato sin abrirlo: mides voltaje, escuchas, pruebas. Con esas pistas imaginas lo que hay dentro.' },
    { h: 'Vamos paso por paso: la historia del átomo', t: 'Desliza la línea del tiempo. Cada modelo corrige al anterior.',
      en: 'Cada modelo es una versión mejorada, como las versiones de un software: 1.0 Dalton, 2.0 Thomson, 3.0 Rutherford, 4.0 Bohr.',
      v: () => V.line([
        { a: 'c. 500 a. C.', t: 'Leucipo y Demócrito', s: 'La materia se divide hasta llegar a partículas indivisibles: los átomos' },
        { a: '1803-1808', t: 'Dalton', s: 'Primer modelo: átomos que no se destruyen, con peso propio; forman elementos y compuestos' },
        { a: '1897', t: 'Thomson', s: 'Descubre el electrón (rayos catódicos). Átomo como «granada»: cargas + y − repartidas' },
        { a: '1911', t: 'Rutherford', s: 'Lámina de oro y rayos alfa: hay un núcleo pequeño con carga + y casi toda la masa' },
        { a: '1913', t: 'Bohr', s: 'Electrones en órbitas con energía fija (niveles). Saltan al absorber y emiten fotones al regresar' },
        { a: '1926', t: 'Dirac y Jordan', s: 'Modelo mecánico-cuántico: 4 números cuánticos (n, l, m, s)' }]) },
    { h: 'Observa con atención: lo que hay que recordar de cada uno', t: 'En el examen te describen un descubrimiento y tú eliges el nombre. Estas son las pistas:',
      en: 'Thomson trabajó con rayos catódicos, que son electrones en movimiento: lo mismo que fluye por un cable cuando hay corriente.',
      v: () => V.tbl(['Si la pregunta dice…', 'Es…'], [
        ['primeros en usar la palabra «átomo»; partículas indivisibles', '<b>Leucipo y Demócrito</b>'],
        ['primer modelo o teoría atómica; átomos que no se destruyen', '<b>Dalton</b>'],
        ['rayos catódicos, partículas negativas atraídas por la carga positiva, electrón', '<b>Thomson</b>'],
        ['lámina de oro, rayos alfa, núcleo con carga positiva', '<b>Rutherford</b>'],
        ['órbitas, niveles de energía, electrón excitado, fotones', '<b>Bohr</b>'],
        ['neutrón (partícula sin carga, 1932)', '<b>Chadwick</b>']]) },
    { h: 'El modelo de Bohr, como una escalera', t: 'Bohr dijo que el electrón vive en «escalones» de energía. Para <b>subir</b> a un nivel más alto necesita <b>absorber</b> energía (se vuelve un <mark>electrón excitado</mark>). Cuando <b>baja</b> otra vez, <b>emite</b> esa energía en forma de <mark>fotones</mark> (cuantos o paquetes de energía). Cada nivel acepta como máximo <b>2n²</b> electrones: 2 en el nivel 1, 8 en el 2, 18 en el 3.',
      en: 'Es como un foco o un LED: los electrones reciben energía eléctrica, suben de nivel y al regresar sueltan la energía como luz.',
      v: () => V.flow([{ t: 'Absorbe energía', s: 'El electrón sube a una órbita más lejana (excitado)' }, { t: 'Regresa a su órbita', s: 'Baja a un nivel de menor energía' }, { t: 'Emite fotones', s: 'Libera la energía como luz: el espectro de líneas de cada átomo' }]) }
  ],
  trap: [
    '<b>Thomson ≠ Rutherford.</b> Thomson descubrió el electrón; Rutherford descubrió el núcleo con la lámina de oro.',
    'Al regresar a una órbita menor, el electrón <b>emite</b> (no absorbe) energía.',
    '«Partículas indivisibles» es de Leucipo y Demócrito, no de Aristóteles (él pensaba que la materia se podía dividir sin fin).'
  ],
  trick: 'Orden de los modelos: <b>«De Todos, Rutherford Brilla»</b> = Dalton, Thomson, Rutherford, Bohr. Thomson = <b>T</b> de «<b>t</b>ubo de rayos catódicos». Rutherford = <b>R</b> de «<b>r</b>ebote en el oro».',
  ex: { q: 'Un científico bombardeó una lámina delgada de oro con rayos alfa. Casi todos pasaron, pero algunos rebotaron. ¿Quién fue y qué concluyó?', pasos: ['Pista clave: «lámina de oro» y «rayos alfa».', 'Ese experimento es de 1911 y lo hizo Rutherford.', 'Si algunos rayos rebotan, chocaron con algo pequeño y pesado: el núcleo.'], a: 'Rutherford: el átomo tiene un núcleo pequeño con la carga positiva y casi toda la masa.' },
  prac: [
    { lvl: 'g', q: '¿Qué científico demostró que los rayos catódicos son partículas con carga negativa, a las que llamó electrones?', o: ['Dalton', 'Thomson', 'Rutherford', 'Bohr'], a: 1,
      pasos: ['Busca la palabra clave: «rayos catódicos».', 'Los rayos catódicos se relacionan con el descubrimiento del electrón (1897).', 'Ese descubrimiento es de Joseph John Thomson.'],
      why: 'Thomson comprobó en 1897 que los rayos catódicos son un flujo de partículas negativas: los electrones.',
      oe: ['Dalton propuso el primer modelo atómico, pero no descubrió el electrón.', '¡Correcto!', 'Rutherford descubrió el núcleo.', 'Bohr propuso las órbitas con niveles de energía.'] },
    { lvl: 's', q: 'Según Bohr, ¿qué hace un electrón para pasar a una órbita de mayor energía?', o: ['Emite fotones', 'Pierde su carga', 'Absorbe energía', 'Se une al núcleo'], a: 2,
      pista: 'Piensa en subir una escalera: ¿se gasta o se recibe energía?',
      why: 'Para subir de nivel necesita absorber energía; cuando regresa, la emite como fotones.',
      oe: ['Emite fotones cuando baja, no cuando sube.', 'El electrón no pierde su carga.', '¡Correcto!', 'Los electrones no caen al núcleo.'] },
    { lvl: 'i', q: '¿Quiénes fueron los primeros en usar el término «átomo» para la mínima parte indivisible de la materia?', o: ['Aristóteles y Tales de Mileto', 'Leucipo y Demócrito', 'Anaxímenes y Empédocles', 'Dalton y Thomson'], a: 1,
      why: 'Leucipo y su discípulo Demócrito concluyeron que la materia está formada por partículas indivisibles, a las que Demócrito llamó átomos.',
      oe: ['Aristóteles creía que la materia era continua.', '¡Correcto!', 'Ellos hablaban de aire o de cuatro elementos.', 'Dalton retomó la palabra mucho después (1803).'] }
  ]
});

/* ───────── L · NÚMEROS CUÁNTICOS Y CONFIGURACIÓN ───────── */
LESSONS.push({
  id: 'cuantica', world: 1, unit: 1, title: 'Números cuánticos y configuración electrónica', prio: 'alta', mins: 25,
  freq: 'Salió 2 veces en el simulacro Forma A. Fallaste la de configuración del sodio (pregunta 4): es un cálculo que se aprende con un truco.',
  goal: 'Escribir la configuración electrónica de un átomo y saber qué indica cada número cuántico.',
  en: 'En el taller: la configuración es como acomodar cables en una caja de fusibles. Primero llenas los espacios de abajo (menor energía) y luego los de arriba.',
  steps: [
    { h: 'Imagina que…', t: 'Imagina un estadio con secciones, filas y asientos. Para encontrar a una persona das su dirección completa. El electrón también tiene una «dirección» de 4 datos: los <mark>números cuánticos</mark> n, l, m y s (modelo de Dirac y Jordan).',
      en: 'Como el domicilio de un cliente: colonia, calle, número y si es casa A o B.' },
    { h: 'Vamos paso por paso: qué dice cada número', t: 'Memoriza qué determina cada letra. Es lo que más preguntan:',
      en: 'El espín es como un motor que gira en un sentido o en el otro: solo hay dos opciones.',
      v: () => V.tbl(['Número', 'Nombre', 'Determina…'], [
        ['<b>n</b>', 'Principal', 'El <b>nivel de energía</b> (1 a 7)'],
        ['<b>l</b>', 'Secundario', 'La <b>forma del orbital</b>: s (esfera), p (cacahuate), d, f'],
        ['<b>m</b>', 'Magnético', 'La <b>orientación</b> del orbital en el espacio'],
        ['<b>s</b>', 'Espín (spin)', 'El <b>giro</b> del electrón sobre su eje: +½ o −½']]) },
    { h: 'Observa con atención: cuántos caben en cada subnivel', t: 'Cada subnivel tiene un máximo de electrones. Con esto escribes la configuración:',
      en: 'Como cajas de distinto tamaño: la caja s guarda 2 piezas, la p guarda 6, la d guarda 10 y la f guarda 14.',
      v: () => V.pairs([['s', 'máximo 2 electrones'], ['p', 'máximo 6 electrones'], ['d', 'máximo 10 electrones'], ['f', 'máximo 14 electrones']]) },
    { h: 'El orden de llenado (principio de Aufbau)', t: 'Los electrones llenan primero los subniveles de <b>menor energía</b>. Sigue el diagrama de Moeller con las flechas en diagonal:',
      en: 'Como llenar una cisterna por pisos: no subes al segundo hasta que el primero esté lleno.',
      v: () => V.flow([{ t: '1s', s: 'cabe 2' }, { t: '2s → 2p', s: 'caben 2 + 6' }, { t: '3s → 3p', s: 'caben 2 + 6' }, { t: '4s → 3d → 4p', s: 'caben 2 + 10 + 6' }, { t: '5s → 4d → 5p …', s: 'y así sigue' }]) },
    { h: 'Este error suele aparecer en los exámenes', t: 'La suma de los exponentes (los numeritos de arriba) debe dar el <b>número de electrones</b> del átomo. Si el sodio tiene Z = 11, la suma debe ser 11. Revisa también que no te saltes subniveles: después de 2p6 sigue <b>3s</b>, no 3p.',
      en: 'Como cuadrar la caja al final del día: la suma tiene que dar exacto, ni uno más ni uno menos.' }
  ],
  trap: [
    '<b>l</b> da la <b>forma</b>; <b>m</b> da la <b>orientación</b>; <b>n</b> da el <b>nivel</b>. No las mezcles.',
    'Después de 2p6 va <b>3s</b>. Saltarte a 3p es el error más común.',
    'La suma de exponentes = número de electrones = Z (en un átomo neutro).',

  p4: { u: 3, title: 'Gelatina y papaya', text: 'Si se vierte jugo natural de papaya sobre una gelatina ya cuajada, después de unas horas la gelatina se deshace en las zonas donde tocó el jugo. La gelatina es una proteína, y el jugo de papaya contiene proteasas: moléculas que rompen las proteínas en aminoácidos. Algo parecido ocurre en nuestro sistema digestivo, que descompone moléculas grandes en otras pequeñas para poder absorberlas.' }

  function pool(t) { return BANK.filter(q => q.t === t && !q.eva && !q.p); }

    world(w) { const used = new Set(); let items = []; LESSONS.filter(l => l.world === w).forEach(l => { items = items.concat(pickFrom(l.id, 3, used)); }); startQuiz({ type: 'mini', mode: 'learn', title: 'Mini quiz · Mundo ' + w, items: makeItems(shuffle(items)) }); },
    parcial(u) {
      const used = new Set(); let items = [];

      const weight = { alta: 2, media: 1, baja: 0 };
      ls.forEach(l => { items = items.concat(pickFrom(l.id, weight[l.prio] || 1, used)); });
      items = shuffle(items).slice(0, 13).concat(passagePick(1, used, u));
      startQuiz({ type: 'parcial', unit: u, mode: 'exam', title: 'Simulador parcial · Unidad ' + u, items: makeItems(items) });
    },
    final() {

      Object.keys(FINAL_QUOTA).forEach(t => { const got = pickFrom(t, FINAL_QUOTA[t], used); const u = UNIT_OF(t); (u === 1 ? u1 : u === 2 ? u2 : u3).push(...got); });
      const items = u1.concat(u2, u3);
      startQuiz({ type: 'final', mode: 'exam', title: 'Simulacro final', items: makeItems(items), limit: 90 * 60 });
    },
    eva() { startQuiz({ type: 'eva', mode: 'exam', title: 'Práctica estilo examen en línea', items: makeItems(shuffle(EVA_IDS.map(id => QMAP[id]))) }); },
    calc() { const list = shuffle(BANK.filter(q => q.calc)).slice(0, 15); startQuiz({ type: 'calc', mode: 'learn', title: 'Taller de cálculos', items: makeItems(list) }); },
    errors() {

  function passagePick(nPass, used, unit) {
    const keys = shuffle(Object.keys(PASSAGES).filter(k => !unit || PASSAGES[k].u === unit)); const out = [];

    return out;
  }
  let timerH = null;
  function startTimer() { clearInterval(timerH); const q = UI.quiz; if (!q || !q.limit) return; timerH = setInterval(() => { const el = $('#timer'); const left = q.limit - Math.floor((Date.now() - q.start) / 1000); if (left <= 0) { clearInterval(timerH); finishQuiz(); return; } if (el) el.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; }, 1000); }
  function vQuiz() {

  let breathH = null;
  function runBreath() {
    clearInterval(breathH); let n = 0; const seq = [['Inhala', true], ['Sostén', true], ['Exhala', false]];
    const tick = () => { const c = $('#breathC'); if (!c) { clearInterval(breathH); return; } if (n >= 9) { c.textContent = '¡Listo!'; c.classList.remove('in'); clearInterval(breathH); return; } const s = seq[n % 3]; c.textContent = s[0]; c.classList.toggle('in', s[1]); n++; };
    setTimeout(tick, 600); breathH = setInterval(tick, 4000);
  }

  /* ═════════ RENDER ═════════ */
  const VIEWS = { home: vHome, route: vRoute, lesson: vLesson, quiz: vQuiz, results: vResults, practice: vPractice, review: vReview, flash: vFlash, tf: () => vTF(false), speed: () => vTF(true), order: vOrder, match: vMatch, keys: vKeys, gloss: vGloss, exam: vExam, map: vMap, progress: vProgress, formulas: vFormulas };
  function render(top) {
    const root = $('#app');
    root.innerHTML = `<main class="app" id="main">${(VIEWS[UI.view] || vHome)()}</main>${tabbar()}${modalHTML()}`;
    if (top) window.scrollTo({ top: 0 });
    refreshSpeak();
    if (UI.quiz && UI.view === 'quiz' && UI.quiz.limit) { const el = $('#timer'); const left = UI.quiz.limit - Math.floor((Date.now() - UI.quiz.start) / 1000); if (el) el.textContent = `${Math.floor(Math.max(0, left) / 60)}:${pad(Math.max(0, left) % 60)}`; }
  }

  /* ═════════ ACCIONES ═════════ */
  const A = {
    go(d) { stopSpeak(); if (d.v === 'order') ORD = null; if (d.v === 'match') MAT = null; if (d.v === 'tf' || d.v === 'speed') { TFS = null; clearInterval(speedH); } if (d.v === 'flash') FL = null; UI.view = d.v; render(true); },
    open(d) { openLesson(d.id); },
    openStep(d) { openLesson(d.id, Number(d.s)); },
    filter(d) { UI.routeFilter = d.f; render(); },
    speak(d) { const s = SPEAK_TXT[d.speak]; if (s) speak(s.text, d.speak, s.lang); },
    en(d) { UI.enOpen[d.k] = !UI.enOpen[d.k]; if (S.settings.en) { S.settings.en = false; save(); } render(); },
    nextStep() {
      const l = LMAP[UI.lesson]; const cards = lessonCards(l); stopSpeak();
      if (UI.step < cards.length - 1) { UI.step++; UI.hintN = 0; UI.exN = 0; }
      S.pos[l.id] = UI.step; touch();
      if (cards[UI.step].k === 'end' && !S.done[l.id]) { S.done[l.id] = today(); addXP(60); checkBadges(); }
      save(); render(true); if (S.settings.auto) setTimeout(autoRead, 250);
    },
    prevStep() { stopSpeak(); if (UI.step > 0) { UI.step--; UI.hintN = 0; UI.exN = 0; } render(true); },
    exNext() { UI.exN = (UI.exN || 0) + 1; render(); },
    hintNext() { UI.hintN = (UI.hintN || 0) + 1; render(); },
    pracAns(d) {
      const l = LMAP[UI.lesson]; const c = lessonCards(l)[UI.step]; const p = l.prac[c.i]; const k = Number(d.k);
      UI.prac[c.i] = k; const ok = k === p.a; record(l.id, ok);
      const key = `${l.id}-${c.i}`; if (ok && !S.practiced[key]) { S.practiced[key] = 1; addXP(10); } else touch();
      render();
    },
    startMini(d) { QUIZ.mini(d.t); },
    startMiniSel() { const v = $('#topicSel').value; QUIZ.mini(v); },
    startWorld(d) { QUIZ.world(Number(d.w)); },
    startParcial(d) { QUIZ.parcial(Number(d.u)); },
    startFinal() { QUIZ.final(); },
    startEva() { QUIZ.eva(); },
    startErrors() { QUIZ.errors(); },
    startCalc() { QUIZ.calc(); },
    skipToPrac() { const l = LMAP[UI.lesson]; UI.step = l.steps.length; UI.hintN = 0; UI.exN = 0; S.pos[l.id] = UI.step; save(); stopSpeak(); render(true); },
    saveExam() {
      const d = ($('#exDate') || {}).value; const t = ($('#exTime') || {}).value; const sd = ($('#exSede') || {}).value;
      if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) { S.settings.examDate = d; S.settings.examSet = true; }
      S.settings.examTime = t || ''; S.settings.sede = (sd || '').trim().slice(0, 120);
      PLAN_CACHE = null; save(); render(true); toast('Listo: tu plan se reacomodó a la nueva fecha.');
    },
    qAns(d) { const z = UI.quiz; if (z.mode === 'learn' && z.checked[z.i]) return; z.ans[z.i] = Number(d.k); render(); },
    qConf(d) { const z = UI.quiz; z.conf[z.i] = z.conf[z.i] === d.c ? undefined : d.c; render(); },
    qCheck() { const z = UI.quiz; z.checked[z.i] = true; const q = QMAP[z.items[z.i].id]; const ok = z.ans[z.i] === q.a; record(q.t, ok); if (ok) { addXP(5); if (S.wrong[q.id]) S.wrong[q.id] = Math.max(0, S.wrong[q.id] - 1); } else { S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; touch(); } save(); render(); },
    qNext() { const z = UI.quiz; stopSpeak(); if (z.i + 1 < z.items.length) { z.i++; render(true); } else if (z.mode === 'learn') { learnFinish(); } else render(); },
    qPrev() { const z = UI.quiz; stopSpeak(); if (z.i > 0) { z.i--; render(true); } },
    qGo(d) { UI.quiz.i = Number(d.k); render(true); },
    qFinish() { finishQuiz(false); },
    qFinishForce() { UI.confirm = null; finishQuiz(true); },
    quitQuiz() { UI.confirm = { msg: '¿Salir del simulador? Perderás las respuestas de este intento.', yes: 'quitYes', no: 'closeConfirm' }; render(); },
    quitYes() { clearInterval(timerH); UI.confirm = null; UI.quiz = null; UI.view = 'practice'; stopSpeak(); render(true); },
    closeConfirm() { UI.confirm = null; render(); },
    gloss() { UI.modal = 'gloss'; render(); setTimeout(() => { const i = $('#glossQ'); if (i) i.focus(); }, 50); },
    breath() { UI.modal = 'breath'; render(); runBreath(); },
    closeModal() { UI.modal = null; clearInterval(breathH); render(); },
    flFlip() { FL.flip = !FL.flip; const el = document.querySelector('.flip'); if (el) el.classList.toggle('on', FL.flip); },
    flNext(d) { if (d.k === '1') { if (!S.flash[FL.list[FL.i]]) { S.flash[FL.list[FL.i]] = 1; addXP(2); } } else { delete S.flash[FL.list[FL.i]]; touch(); } FL.i = (FL.i + 1) % FL.list.length; FL.flip = false; checkBadges(); save(); render(); },
    tfAns(d) {
      const it = TF[TFS.list[TFS.i]]; const ok = (d.v === '1') === it[1]; if (ok) { TFS.ok++; addXP(2); } else touch();
      TFS.last = { ok, txt: (it[1] ? 'Verdadero. ' : 'Falso. ') + it[2] }; TFS.i++;
      if (TFS.speed && TFS.i >= TFS.list.length) { TFS.list = TFS.list.concat(shuffle(TF.map((_, i) => i))); }
      render();
    },
    speedGo() {
      TFS.start = Date.now(); clearInterval(speedH); render();
      speedH = setInterval(() => { const left = 60 - Math.floor((Date.now() - TFS.start) / 1000); const el = $('#spTimer'); if (el) el.textContent = left; if (left <= 0) { clearInterval(speedH); TFS.over = true; if (TFS.ok > S.tfBest) S.tfBest = TFS.ok; checkBadges(); save(); render(); } }, 250);
    },
    tfAgain() { const sp = TFS.speed; TFS = null; clearInterval(speedH); UI.view = sp ? 'speed' : 'tf'; render(true); },
    ordStart(d) { const g = ORDER_GAMES.find(x => x.id === d.id); let cur = shuffle(g.items); while (cur.every((x, i) => x === g.items[i])) cur = shuffle(g.items); ORD = { id: d.id, cur, checked: false }; render(true); },
    ordBack() { ORD = null; render(true); },
    ordMv(d) { const k = Number(d.k), dd = Number(d.d), j = k + dd; if (j < 0 || j >= ORD.cur.length) return; [ORD.cur[k], ORD.cur[j]] = [ORD.cur[j], ORD.cur[k]]; ORD.checked = false; render(); },
    ordCheck() { ORD.checked = true; const g = ORDER_GAMES.find(x => x.id === ORD.id); if (ORD.cur.every((x, i) => x === g.items[i]) && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } else touch(); save(); render(); },
    matStart(d) { const g = MATCH_GAMES.find(x => x.id === d.id); const idx = g.pairs.map((_, i) => i); MAT = { id: d.id, L: shuffle(idx), R: shuffle(idx), done: {}, selL: null, err: null }; render(true); },
    matBack() { MAT = null; render(true); },
    matL(d) { MAT.selL = Number(d.i); MAT.err = null; render(); },
    matR(d) {
      const i = Number(d.i); if (MAT.selL === null) { toast('Primero toca un concepto de la izquierda.'); return; }
      if (i === MAT.selL) { MAT.done[i] = 1; MAT.selL = null; MAT.err = null; const g = MATCH_GAMES.find(x => x.id === MAT.id); if (Object.keys(MAT.done).length === g.pairs.length && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } touch(); }
      else { MAT.err = i; }
      render();
    },
    copyShare() { const t = shareText(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copiado. Pégalo en WhatsApp.'), () => selectShare()); else selectShare(); },
    askReset() { UI.confirm = { msg: '¿Borrar todo tu avance en este teléfono? No se puede deshacer.', yes: 'doReset', no: 'closeConfirm' }; render(); },
    doReset() { S = defaults(); save(); UI.confirm = null; UI.view = 'home'; render(true); toast('Avance borrado.'); }
  };
  function selectShare() { const el = $('#shareTxt'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo.'); }
  function learnFinish() {
    const z = UI.quiz; let c = 0; const topics = {}; const review = [];
    z.items.forEach((it, k) => { const q = QMAP[it.id]; const ok = z.ans[k] === q.a; if (ok) c++; topics[q.t] = topics[q.t] || [0, 0]; topics[q.t][1]++; if (ok) topics[q.t][0]++; review.push({ k, id: q.id, ok, sel: z.ans[k], order: it.order }); });
    UI.review = { type: z.type, title: z.title, date: today(), c, n: z.items.length, grade: grade10(c, z.items.length), units: { 1: [0, 0], 2: [0, 0], 3: [0, 0] }, topics, sureWrong: [], review };
    if (z.topic) S.games['mini-' + z.topic] = 1;
    UI.quiz = null; UI.view = 'results'; checkBadges(); save(); render(true);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    if (el.classList.contains('sheet-modal')) return;
    const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip')) { e.preventDefault(); A.flFlip(); } if (e.key === 'Escape' && (UI.modal || UI.confirm)) { UI.modal = null; UI.confirm = null; render(); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'glossQ') { const l = $('#glossList'); if (l) l.innerHTML = glossList(e.target.value); }
    if (e.target.id === 'rate') { S.settings.rate = Number(e.target.value); const v = $('#rateV'); if (v) v.textContent = S.settings.rate.toFixed(2); save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'flTopic') { initFlash(t.value); render(); }
    if (t.dataset.a2 === 'chk') { S.checks[t.dataset.i] = t.checked; save(); }
    if (t.dataset.a2 === 'setEn') { S.settings.en = t.checked; save(); }
    if (t.dataset.a2 === 'setAuto') { S.settings.auto = t.checked; save(); }
  });

  checkBadges();
  render();
})();
</script>
</body>
</html>
